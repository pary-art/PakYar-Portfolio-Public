<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status_code }} | پاکیار</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #123b52;
            --teal: #0f766e;
            --muted: #647987;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
            place-items: center;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 15%, rgba(20, 184, 166, .18), transparent 30%),
                linear-gradient(135deg, #f4fafb, #edf6f8);
            font-family: Tahoma, Arial, sans-serif;
        }

        .card {
            width: min(100%, 560px);
            padding: clamp(1.5rem, 5vw, 3rem);
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: 28px;
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 22px 55px rgba(18, 59, 82, .13);
            text-align: center;
        }

        .icon {
            display: grid;
            width: 76px;
            height: 76px;
            margin: 0 auto 1.2rem;
            place-items: center;
            border-radius: 24px;
            color: #fff;
            background: linear-gradient(145deg, var(--ink), var(--teal));
            font-size: 1.7rem;
            font-weight: 800;
        }

        .code {
            margin: 0;
            color: var(--teal);
            font-size: clamp(2.6rem, 9vw, 4.8rem);
            line-height: 1;
        }

        h1 {
            margin: 1rem 0 .65rem;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
        }

        p {
            margin: 0 auto 1.5rem;
            color: var(--muted);
            line-height: 2;
        }

        a {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            padding: .7rem 1.1rem;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, var(--ink), var(--teal));
            text-decoration: none;
            font-weight: 700;
        }

        a:hover { filter: brightness(1.08); }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">پاکیار</div>
        <p class="code">{{ status_code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('main.index') }}">بازگشت به سامانه</a>
    </main>
</body>
</html>
