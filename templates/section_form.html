{% extends "base.html" %}

{% block title %}افزودن بخش | پاکیار{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card page-card p-4">
            <h2 class="fw-bold mb-1">افزودن بخش</h2>
            <p class="text-muted mb-4">اطلاعات بخش جدید را وارد کنید.</p>

            <form method="post" action="{{ url_for('main.add_section') }}">
                <div class="mb-3">
                    <label class="form-label" for="name">نام بخش</label>
                    <input class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="floor">طبقه</label>
                    <input class="form-control" id="floor" name="floor">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="description">توضیحات</label>
                    <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">ذخیرهٔ بخش</button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('main.sections') }}">انصراف</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
